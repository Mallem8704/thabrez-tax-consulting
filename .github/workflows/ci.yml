name: CI Test & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CI: "true"
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/thabrez_db?schema=public"
  JWT_SECRET: "ci-dummy-jwt-secret-for-testing-only-12345678901234567890"
  JWT_EXPIRATION: "1d"
  NEXTAUTH_SECRET: "ci-dummy-nextauth-secret-for-testing-only-12345678901234567890"
  NEXTAUTH_URL: "http://localhost:3000"
  ADMIN_NEXTAUTH_URL: "http://localhost:3005"
  NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
  API_URL: "http://localhost:4000/api/v1"
  PORT: 4000

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @thabrez/db db:generate

      - name: Verify Types Across Packages
        run: pnpm run type-check

      - name: Run Test Suites (Jest)
        run: pnpm run test

      - name: Run Production Turborepo Build
        run: pnpm turbo run build
