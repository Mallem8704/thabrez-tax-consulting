version: '3.8'

services:
  # ===========================================================================
  # 1. PostgreSQL 16 Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: thabrez_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thabrez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thabrez_production_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-thabrez_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thabrez} -d ${POSTGRES_DB:-thabrez_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - thabrez_network

  # ===========================================================================
  # 2. Redis 7 Queue & Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: thabrez_redis_prod
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thabrez_network

  # ===========================================================================
  # 3. NestJS REST API
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: thabrez_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-thabrez}:${POSTGRES_PASSWORD:-thabrez_production_secret_change_me}@postgres:5432/${POSTGRES_DB:-thabrez_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-thabrez_super_secret_jwt_key_prod_32_chars_min}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,https://thabreztaxconsulting.com,https://admin.thabreztaxconsulting.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ap-south-1.amazonaws.com}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-placeholder}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-placeholder}
      S3_BUCKET: ${S3_BUCKET:-thabrez-documents-prod}
    networks:
      - thabrez_network

  # ===========================================================================
  # 4. Next.js Web App & Client Portal
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: thabrez_web_prod
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-thabrez_super_secret_jwt_key_prod_32_chars_min}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      API_URL: http://api:4000/api/v1
    networks:
      - thabrez_network

  # ===========================================================================
  # 5. Next.js Staff Management Console
  # ===========================================================================
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: thabrez_admin_prod
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3001
      NODE_ENV: production
      NEXTAUTH_URL: ${ADMIN_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-thabrez_super_secret_jwt_key_prod_32_chars_min}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      API_URL: http://api:4000/api/v1
    networks:
      - thabrez_network

  # ===========================================================================
  # 6. Nginx Edge Reverse Proxy & Gateway
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: thabrez_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - admin
      - api
    networks:
      - thabrez_network

# =============================================================================
# Persistent Data Volumes & Isolated Network
# =============================================================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  thabrez_network:
    driver: bridge
